<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jair A. Pérez #21</title>
    <link rel="stylesheet" href="Css/style.css">
    <link rel="shortcut icon" href="img/Kitsune_Fruit-removebg-preview.png" type="image/x-icon">
</head>
<body>
    <main class="container">
        <article class="card">
            <img src="img/dondo.svg" alt="Fondo Kitsune" class="card-header">
            <div class="card-body">
                <div class="card-body-contentimg">
                    <img src="img/Kitsune_Fruit-removebg-preview.png" alt="Kitsune" class="card-body-contentimg-img" width="150">

                </div>
                <h1 class="card-body-title">
                    Kitsune
                    <span>#40</span>
                </h1>
                <p class="card-body-text">
                    Coleccionable
                </p>
            </div>
            <div class="card-footer">
                <div class="card-footer-logo">
                    <h3>Logo</h3>
                    <img src="img/Logo kit.jpg" alt="Logo Kit" width="35">
                </div>
                <div class="card-footer-logo">
                    <h3>Rareza</h3>
                    <img src="img/Mythical-removebg-preview.png" alt="Rareza Mitica" width="35">
                </div>
                <div class="card-footer-logo">
                    <h3>Precio</h3>
                    <img src="img/Precio Kitsune.png" alt="Precio Kitsune" width="100">
                </div>
            </div>

        </article>
    </main>
</body>
</html>
